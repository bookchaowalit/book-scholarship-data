[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-scholarship-data"
version = "0.1.0"
description = "Find education funding by degree and applicant eligibility."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-scholarship-data = "book_scholarship_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_scholarship_data = ["*.json"]
